baseURL = "https://xizhiyun1995-netizen.github.io"
locale = "zh-CN"
title = "碳基漫游AI | ChatGPT 订阅保姆级教程"
theme = "stack"
paginate = 10
defaultContentLanguage = "zh"
enableRobotsTXT = true
enableGitInfo = false

[permalinks]
    post = "/p/:slug/"

[menu]
    [[menu.main]]
        identifier = "home"
        name = "首页"
        url = "/"
        weight = 1
    [[menu.main]]
        identifier = "tutorial"
        name = "教程总章"
        url = "/p/chatgpt-subscription-00-guide/"
        weight = 2
    [[menu.main]]
        identifier = "categories"
        name = "分类"
        url = "/categories/"
        weight = 3

[params]
    mainSections = ["post"]
    description = "ChatGPT 订阅保姆级教程——面向中国大陆小白的 iPhone 路线与安卓路线完整指南"
    rssFullContent = true
    SortBy = "weight"

    [params.footer]
        since = 2026
        customText = ""

    [params.dateFormat]
        published = "2006-01-02"
        lastUpdated = "2006-01-02"

    [params.sidebar]
        compact = false
        avatar = ""

    [params.article]
        headingAnchor = false
        math = false
        toc = true
        readingTime = true
        [params.article.list]
            showTags = false
        [params.article.license]
            enabled = false

    [params.widgets]
        homepage = [
            { type = "search" },
            { type = "archives", params = { limit = 5 } },
            { type = "categories", params = { limit = 10 } },
            { type = "tag-cloud", params = { limit = 10 } },
        ]
        page = [{ type = "toc" }]

    [params.colorScheme]
        toggle = true
        default = "auto"

    [params.comments]
        enabled = false

    [params.imageProcessing]
        [params.imageProcessing.content]
            enabled = false
        [params.imageProcessing.thumbnail]
            enabled = false
        [params.imageProcessing.external]
            timeout = "5s"