baseURL = "https://xizhiyun1995-netizen.github.io"
locale = "zh-CN"
title = "碳基漫游 AI"
copyright = "碳基漫游 AI"
theme = "stack"
paginate = 10
defaultContentLanguage = "zh"
hasCJKLanguage = true
enableRobotsTXT = true
enableGitInfo = false

[permalinks]
    post = "/p/:slug/"
    page = "/:slug/"

[[menu.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 1
    params = { icon = "home" }

[[menu.main]]
    identifier = "tutorial"
    name = "教程总章"
    url = "/p/chatgpt-subscription-00-guide/"
    weight = 2
    params = { icon = "list-tree" }

[[menu.main]]
    identifier = "categories"
    name = "分类"
    url = "/categories/"
    weight = 3
    params = { icon = "folder-bookmark" }

[[menu.main]]
    identifier = "dashboard"
    name = "站点仪表盘"
    url = "/dashboard/"
    weight = 4
    params = { icon = "dashboard" }

[[menu.main]]
    identifier = "about"
    name = "关于本站"
    url = "/about/"
    weight = 5
    params = { icon = "user" }

[[menu.main]]
    identifier = "apps"
    name = "教程启动台"
    url = "/apps/"
    weight = 6
    params = { icon = "folder-bookmark" }

[[menu.social]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/xizhiyun1995-netizen/xizhiyun1995-netizen.github.io"
    weight = 1
    params = { icon = "brand-github", newTab = true }

[[menu.social]]
    identifier = "rss"
    name = "RSS"
    url = "/index.xml"
    weight = 2
    params = { icon = "rss", newTab = true }

[params]
    mainSections = ["post"]
    description = "探索 AI 工具、效率与数字生活，记录实用教程与使用经验。"
    rssFullContent = true
    SortBy = "weight"
    favicon = "/img/profile-placeholder.svg"

    [params.footer]
        since = 2026
        customText = ""
        launchDate = "2026-08-02"

    [params.dateFormat]
        published = "2006-01-02"
        lastUpdated = "2006-01-02"

    [params.sidebar]
        compact = false
        emoji = "🧭"
        subtitle = "探索 AI 工具、效率与数字生活"
        avatar = "/img/avatar.jpg"

    [params.article]
        headingAnchor = false
        math = false
        toc = true
        readingTime = true
        [params.article.list]
            showTags = false
        [params.article.license]
            enabled = false

    [params.widgets]
        homepage = [
            { type = "search" },
            { type = "world-clock" },
            { type = "archives", params = { limit = 5 } },
            { type = "categories", params = { limit = 10 } },
            { type = "tag-cloud", params = { limit = 10 } },
        ]
        page = [{ type = "toc" }]

    [params.colorScheme]
        toggle = true
        default = "auto"

    [params.comments]
        enabled = false

    [params.imageProcessing]
        [params.imageProcessing.content]
            enabled = true
        [params.imageProcessing.thumbnail]
            enabled = true
        [params.imageProcessing.external]
            timeout = "5s"

[related]
    includeNewer = true
    threshold = 60
    [[related.indices]]
        name = "tags"
        weight = 100
    [[related.indices]]
        name = "categories"
        weight = 200

[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true
    [markup.tableOfContents]
        endLevel = 4
        ordered = true
        startLevel = 2
    [markup.highlight]
        noClasses = false
        lineNos = true

[outputs]
    home = ["HTML", "RSS"]
