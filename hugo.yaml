baseURL: "https://singleyunn.github.io/"
canonifyURLs: true
title: xizhiyun
theme: stack
copyright: "xizhiyun"
defaultContentLanguage: en
hasCJKLanguage: true
mediaTypes:
  application/yaml:
    suffixes: [yml]
outputFormats:
  CMSConfig:
    mediaType: application/yaml
    baseName: config
    isPlainText: true
    notAlternative: true
  sitemapflat:
    mediaType: application/xml
    baseName: sitemap-flat
    isPlainText: true
    notAlternative: true
languages:
  en: { label: English, locale: en-US, weight: 1 }
  zh:
    label: 简体中文
    locale: zh-Hans
    weight: 2
    copyright: "我的博客"
    params:
      sidebar:
        subtitle: 探索 AI 工具、效率与数字生活
pagination: { pagerSize: 10 }
permalinks:
  post: /p/:slug/
  page: /:slug/
params:
  mainSections: [post]
  description: 探索 AI 工具、效率与数字生活，后续将逐步发布实用教程与个人记录。
  favicon: /img/liquid-stack/logo-transparent.png
  dateFormat:
    published: 02/Jan/2006
    lastUpdated: 02/Jan/2006 15:04 MST
  sidebar:
    emoji: "😄"
    subtitle: AI tools, practical workflows, and digital life.
    avatar: /img/github.png
  footer:
    since: 2026
    launchDate: "2026-08-01"
  article:
    math: true
    toc: true
    readingTime: true
    license: { enabled: true, default: Licensed under CC BY-SA 4.0 }
  comments:
    enabled: false
  widgets:
    homepage:
      - { type: search }
      - { type: world-clock }
      - type: archives
        params: { limit: 5 }
      - type: categories
        params: { limit: 10 }
      - type: tag-cloud
        params: { limit: 10 }
    page: [{ type: toc }]
  defaultImage:
    opengraph: { enabled: true, local: true, src: /img/liquid-stack/featured.png }
  colorScheme: { toggle: true, default: auto }
  imageProcessing:
    thumbnail: { enabled: true }
    content: { enabled: true }
menu:
  social:
    - identifier: github
      name: GitHub
      url: "https://github.com/xizhiyun1995-netizen"
      weight: 1
      params: { icon: brand-github, newTab: true }
    - identifier: x
      name: X
      url: "https://x.com/Singlea8uw"
      weight: 2
      params: { icon: brand-x, newTab: true }
    - identifier: youtube
      name: YouTube
      url: "https://www.youtube.com/@ZhiyunXi-single"
      weight: 3
      params: { icon: brand-youtube, newTab: true }
    - identifier: douyin
      name: 抖音
      url: "https://www.douyin.com/user/MS4wLjABAAAAihobAUhipbCjeoYAcIGQdcCTlPiMTfGWgX92Qo7dqMiQHbOkimgbAgvfcQ81ZTmc"
      weight: 4
      params: { icon: brand-douyin, newTab: true }
    - identifier: xiaohongshu
      name: 小红书
      url: "https://www.xiaohongshu.com/user/profile/68c624be0000000019010fd4"
      weight: 5
      params: { icon: brand-xiaohongshu, newTab: true }
    - identifier: bilibili
      name: Bilibili
      url: "https://space.bilibili.com/183432685?spm_id_from=333.1007.0.0"
      weight: 6
      params: { icon: brand-bilibili, newTab: true }
    - identifier: rss
      name: RSS
      url: /index.xml
      weight: 7
      params: { icon: rss, newTab: true }
related:
  includeNewer: true
  threshold: 60
  indices: [{ name: tags, weight: 100 }, { name: categories, weight: 200 }]
markup:
  goldmark:
    renderer: { unsafe: true }
  tableOfContents: { endLevel: 4, ordered: true, startLevel: 2 }
  highlight: { noClasses: false, lineNos: true }
outputs:
  home: [HTML, RSS, sitemapflat]
