baseURL: "https://xizhiyun1995-netizen.github.io/"
canonifyURLs: true
title: 碳基漫游 AI
theme: stack
copyright: "碳基漫游 AI"
defaultContentLanguage: en
hasCJKLanguage: true
mediaTypes:
  application/yaml:
    suffixes: [yml]
outputFormats:
  CMSConfig:
    mediaType: application/yaml
    baseName: config
    isPlainText: true
    notAlternative: true
  sitemapflat:
    mediaType: application/xml
    baseName: sitemap-flat
    isPlainText: true
    notAlternative: true
languages:
  en: { label: English, locale: en-US, weight: 1 }
  zh:
    label: 简体中文
    locale: zh-Hans
    weight: 2
    copyright: "我的博客"
    params:
      sidebar:
        subtitle: 探索 AI 工具、效率与数字生活
pagination: { pagerSize: 10 }
permalinks:
  post: /p/:slug/
  page: /:slug/
params:
  mainSections: [post]
  description: 探索 AI 工具、效率与数字生活，后续将逐步发布实用教程与个人记录。
  favicon: /img/liquid-stack/logo-transparent.png
  dateFormat:
    published: 02/Jan/2006
    lastUpdated: 02/Jan/2006 15:04 MST
  sidebar:
    emoji: "😄"
    subtitle: AI tools, practical workflows, and digital life.
    avatar: /img/avatar.jpg
  footer:
    since: 2026
    customText: Built with Liquid Stack.
    demoSiteViews: 2673
    demoRuntimeDays: 365
  article:
    math: true
    toc: true
    readingTime: true
    license: { enabled: true, default: Licensed under CC BY-SA 4.0 }
  comments:
    enabled: false
    provider: waline
    waline:
      serverURL: https://example.invalid/waline
      demoMode: true
  widgets:
    homepage:
      - { type: search }
      - { type: world-clock }
      - type: archives
        params: { limit: 5 }
      - type: categories
        params: { limit: 10 }
      - type: tag-cloud
        params: { limit: 10 }
    page: [{ type: toc }]
  defaultImage:
    opengraph: { enabled: true, local: true, src: /img/liquid-stack/featured.png }
  colorScheme: { toggle: true, default: auto }
  imageProcessing:
    thumbnail: { enabled: true }
    content: { enabled: true }
menu:
  social:
    - { identifier: github, name: GitHub, url: https://github.com/xizhiyun1995-netizen/xizhiyun1995-netizen.github.io, weight: 1, params: { icon: brand-github, newTab: true } }
    - { identifier: rss, name: RSS, url: /index.xml, weight: 2, params: { icon: rss, newTab: true } }
related:
  includeNewer: true
  threshold: 60
  indices: [{ name: tags, weight: 100 }, { name: categories, weight: 200 }]
markup:
  goldmark:
    renderer: { unsafe: true }
  tableOfContents: { endLevel: 4, ordered: true, startLevel: 2 }
  highlight: { noClasses: false, lineNos: true }
outputs:
  home: [HTML, RSS, sitemapflat]
